name: Build Lemuroid Sync

on:
  push:
    branches: [sync]
    tags: ["sync-*"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Restore signing key
        run: echo "${{ secrets.SYNC_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/sync.jks"

      - name: Build freeDynamic release
        env:
          SYNC_KEYSTORE_PATH: ${{ runner.temp }}/sync.jks
          SYNC_KEY_ALIAS: lemuroid-sync
          SYNC_KEYSTORE_PASSWORD: ${{ secrets.SYNC_KEYSTORE_PASSWORD }}
          SYNC_KEY_PASSWORD: ${{ secrets.SYNC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDynamicRelease
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk lemuroid-sync.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-sync-apk
          path: lemuroid-sync.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/sync-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" lemuroid-sync.apk --title "${GITHUB_REF_NAME}" --notes "Lemuroid with a mirrored saves folder for Syncthing."

    permissions:
      contents: write
