name: Build Lemuroid Sync

# Builds the "sync" branch merged with the latest upstream Lemuroid release, signs it with the
# fork's permanent key and publishes it as a GitHub release (watch it with Obtainium on the phone).
# The merge happens only in the runner: nothing is pushed back, so upstream edits to its own
# workflow files never need the "workflows" token permission.
on:
  push:
    branches: [sync]
  schedule:
    - cron: "17 6 * * *" # daily: pick up new upstream releases
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: build-sync
  cancel-in-progress: false

jobs:
  build:
    name: Merge upstream release, build signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync
          fetch-depth: 0

      - name: Merge latest upstream release
        id: merge
        run: |
          set -euo pipefail
          git config user.name "lemuroid-sync bot"
          git config user.email "lemuroid-sync@users.noreply.github.com"
          upstream_tag=$(gh api repos/Swordfish90/Lemuroid/releases/latest --jq .tag_name)
          git fetch --no-tags https://github.com/Swordfish90/Lemuroid.git "refs/tags/${upstream_tag}:refs/tags/upstream-${upstream_tag}"
          if ! git merge --no-edit "upstream-${upstream_tag}"; then
            # Upstream workflow files we deleted on purpose: keep them deleted.
            git diff --name-only --diff-filter=U | grep '^\.github/workflows/' | xargs -r git rm -q
            # Our README intro sits on top of upstream's; keep ours rather than block the release.
            if git diff --name-only --diff-filter=U | grep -qx 'README.md'; then
              git checkout --ours README.md && git add README.md
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
              git merge --abort
              title="Merge conflict with upstream ${upstream_tag}"
              if ! gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[].number' | grep -q .; then
                gh issue create --title "${title}" --body "$(printf 'Automatic merge of upstream Lemuroid %s into sync failed. Conflicting files:\n\n%s\n\nMerge it by hand and push to sync.' "${upstream_tag}" "${files}")"
              fi
              exit 1
            fi
            git commit -q --no-edit
          fi
          # Named after the last commit that changes the app, so README and workflow pushes don't
          # publish an identical release.
          app_rev=$(git rev-parse --short=8 "$(git log -1 --format=%H origin/sync -- . ':(exclude)README.md' ':(exclude).github')")
          release_tag="sync-${upstream_tag}-${app_rev}"
          echo "app_rev=${app_rev}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${release_tag} already published, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out submodules
        if: steps.merge.outputs.skip == 'false'
        run: git submodule update --init --recursive

      # LibretroDroid comes from the sybenx fork (link cable). Use its build of whatever version upstream
      # Lemuroid asks for; the fork follows upstream releases on its own.
      - name: Match the LibretroDroid fork to upstream's version
        if: steps.merge.outputs.skip == 'false'
        run: |
          set -euo pipefail
          wanted=$(sed -n 's/.*const val libretrodroid *= *"\(.*\)".*/\1/p' buildSrc/src/main/java/deps.kt | head -1)
          current=$(cat libretrodroid-fork.version)
          if [ "${current%-sync.*}" = "${wanted}" ]; then
            echo "Upstream wants LibretroDroid ${wanted}, using ${current}"
            exit 0
          fi
          pattern="^$(printf '%s' "${wanted}" | sed 's/\./\\./g')-sync\.[0-9]+$"
          fork=$(gh api repos/sybenx/LibretroDroid/tags --paginate --jq '.[].name' | grep -E "${pattern}" | sort -V | tail -1 || true)
          if [ -z "${fork}" ]; then
            title="LibretroDroid fork has no build of ${wanted} yet"
            if ! gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[].number' | grep -q .; then
              gh issue create --title "${title}" --body "$(printf 'Upstream Lemuroid now uses LibretroDroid %s. The fork (sybenx/LibretroDroid) follows upstream releases daily; if its workflow opened an issue, merge by hand and tag %s-sync.1, then rerun this build.' "${wanted}" "${wanted}")"
            fi
            exit 1
          fi
          echo "Upstream wants LibretroDroid ${wanted}, using ${fork}"
          echo "${fork}" > libretrodroid-fork.version

      - name: Set up JDK 17
        if: steps.merge.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build freeDynamic release
        if: steps.merge.outputs.skip == 'false'
        env:
          SYNC_KEYSTORE_PATH: ${{ runner.temp }}/sync.jks
          SYNC_KEY_ALIAS: lemuroid-sync
          SYNC_KEYSTORE_PASSWORD: ${{ secrets.SYNC_KEYSTORE_PASSWORD }}
          SYNC_KEY_PASSWORD: ${{ secrets.SYNC_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.SYNC_KEYSTORE_B64 }}" | base64 -d > "$SYNC_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleFreeDynamicRelease
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk lemuroid-sync.apk

      - name: Upload APK
        if: steps.merge.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-sync-apk
          path: lemuroid-sync.apk

      - name: Publish release
        if: steps.merge.outputs.skip == 'false'
        run: |
          gh release create "${{ steps.merge.outputs.release_tag }}" lemuroid-sync.apk \
            --target sync \
            --title "Lemuroid Sync (upstream ${{ steps.merge.outputs.upstream_tag }})" \
            --notes "Lemuroid ${{ steps.merge.outputs.upstream_tag }} + sync branch ${{ steps.merge.outputs.app_rev }}: saves mirrored to a user-picked folder for Syncthing."

  keepalive:
    # GitHub disables scheduled workflows in repos with no activity for 60 days; re-enabling
    # through the API resets that timer without dummy commits.
    name: Keep schedule alive
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build-sync.yml/enable"
